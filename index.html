<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Roll, Flip, Choose</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet"><style>
:root{--bg:#070b1a;--ink:#eef2ff;--mute:#8d99c2;--cy:#22e4ff;--mg:#ff3d9a;--go:#ffc83d;--vi:#8b5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 700px at 15% -10%,#1a1f5a 0%,transparent 60%),radial-gradient(900px 600px at 100% 10%,#3a0f4d 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:34px 18px 60px}
h1{font-size:clamp(2.3rem,8vw,3.8rem);font-weight:800;letter-spacing:-.04em;margin:0 0 6px;line-height:1;background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg),var(--cy));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 14s linear infinite}

.sub{color:var(--mute);margin:0 0 26px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:5px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 1rem inherit;font-family:inherit;padding:11px;border-radius:12px;cursor:pointer;transition:.25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:#06101f;background:linear-gradient(135deg,var(--cy),var(--vi));}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.panel{position:relative;background:rgba(14,20,48,.62);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:24px;}
.panel:before{content:"";position:absolute;inset:-1px;border-radius:23px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--cy),var(--mg),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 12s linear infinite;pointer-events:none}

.panel[hidden]{display:none}
.panel:not([hidden]){animation:in .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:5px;font-size:.9rem;color:var(--mute);font-weight:600}
input,select,textarea{font:inherit;font-family:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;min-width:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--cy);}
select option{color:#111}
input[type=number]{width:110px}
textarea{width:100%;min-height:130px;resize:vertical}
.go{position:relative;overflow:hidden;font:800 1.05rem inherit;font-family:inherit;color:#1b0a14;background:linear-gradient(135deg,var(--go),var(--mg));border:0;border-radius:14px;padding:13px 30px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.go:hover{transform:translateY(-2px) scale(1.04);}
.go:active{transform:scale(.96)}
.go:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:sweep 2.8s infinite}
@keyframes sweep{60%,100%{left:130%}}
.out{margin-top:22px;min-height:40px}
.stats{display:flex;flex-wrap:wrap;gap:10px 30px;margin:6px 0 18px;color:var(--mute)}
.stats b{display:block;font-size:clamp(1.6rem,6vw,2.3rem);font-weight:800;line-height:1.1;color:var(--ink);text-shadow:0 0 18px rgba(34,228,255,.6)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;max-height:290px;overflow:auto;padding:6px 2px;perspective:600px}
.tile{min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(139,92,255,.35),rgba(34,228,255,.18));border:1px solid rgba(255,255,255,.18);border-radius:12px;font-weight:800;animation:tumble .7s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:var(--d,0s)}
.tile.max{border-color:var(--go);}
.tile.h{background:linear-gradient(145deg,var(--cy),var(--vi));color:#06101f}
.tile.t{background:linear-gradient(145deg,var(--go),var(--mg));color:#1b0a14}
@keyframes tumble{0%{opacity:0;transform:translateY(-70px) rotateX(-320deg) rotateZ(-200deg) scale(.2)}70%{opacity:1}100%{transform:none}}
.tally{display:grid;gap:6px;margin-top:16px}
.bar{display:grid;grid-template-columns:40px 1fr 74px;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--cy),var(--mg));transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.bar span:last-child{text-align:right;color:var(--mute)}
.stage{height:190px;display:grid;place-items:center;perspective:700px}
.coin{position:relative;width:120px;height:120px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.3rem;backface-visibility:hidden;border:6px solid rgba(255,255,255,.35);}
.face.f{background:radial-gradient(circle at 30% 30%,#fff3b8,var(--go) 55%,#c98a00);color:#4a3000}
.face.b{background:radial-gradient(circle at 30% 30%,#ffd1ea,var(--mg) 55%,#a3145f);color:#fff;transform:rotateY(180deg)}
.shadow{width:90px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);margin-top:-6px}
.reel{height:84px;border-radius:16px;display:grid;place-items:center;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);overflow:hidden;padding:0 14px;text-align:center;word-break:break-word}
.reel.spin{color:var(--mute);}
.reel.done{color:#06101f;background:linear-gradient(135deg,var(--cy),var(--go));animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{from{transform:scale(.7)}}
.picks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pick{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 16px;font-weight:700;font-size:1.1rem;animation:slide .5s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d,0s)}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}}
.note{color:var(--mute);font-size:.9rem;margin-top:10px}
.err{color:#ff7a93;font-weight:600;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.wheelwrap{position:relative;width:min(100%,340px);margin:22px auto 0}
.wheelwrap canvas{display:block;width:100%;aspect-ratio:1;border-radius:50%;}
.ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border:13px solid transparent;border-top:30px solid var(--go);z-index:2}
.case{position:relative;height:168px;margin-top:20px;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--go);z-index:2}
.strip{display:flex;gap:8px;margin-top:12px;will-change:transform}
.fc{flex:0 0 120px;height:144px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.95rem;background:rgba(255,255,255,.06);border-bottom:4px solid var(--c);}
.fc.win{}
.fc img,.res img{width:70px;height:70px;object-fit:contain}
.orb{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),var(--c) 45%,rgba(0,0,0,.4) 135%);}
.orb b{font-size:1.6rem;color:#0a0f24}
.orb:before{content:"";position:absolute;top:-6px;left:50%;width:16px;height:10px;border-radius:0 100% 0 100%;background:#3ddc84;transform:translateX(-30%) rotate(-20deg)}
.res{display:flex;align-items:center;gap:18px;padding:18px;border-radius:16px;border:2px solid var(--c);background:rgba(255,255,255,.05);animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
.res .orb{width:84px;height:84px;flex:none}
.res small{color:var(--c);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.res h3{margin:0;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.1}
.rv{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,12,.9);overflow:hidden;animation:rvin .35s ease-out}
.rv[hidden]{display:none}

.rv-glow{position:absolute;left:50%;top:50%;width:120vmin;height:120vmin;margin:-60vmin 0 0 -60vmin;background:radial-gradient(circle,var(--c) 0%,transparent 62%);opacity:.6;animation:rvp 2.6s ease-in-out infinite}
@keyframes rvp{50%{opacity:.9;transform:scale(1.08)}}
.rv-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,var(--c) 0 5deg,transparent 5deg 20deg);opacity:.32;-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 28%);mask-image:radial-gradient(circle,#000 0%,transparent 28%);animation:rvs 45s linear infinite}
@keyframes rvs{to{transform:rotate(360deg)}}
.rv-top{position:absolute;top:calc(env(safe-area-inset-top,0px)+7vh);left:0;right:0;text-align:center;padding:0 70px;z-index:2}
.rv-top small{display:block;color:var(--c);font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 14px var(--c)}
.rv-top h2{margin:2px 0 0;font-size:clamp(2.4rem,10vw,4.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:#fff;text-shadow:0 0 30px var(--c),0 0 60px var(--c)}
.rv-f{position:relative;z-index:2;animation:rvf .8s cubic-bezier(.2,.9,.3,1.4) backwards,flt 3.2s ease-in-out .8s infinite}
@keyframes rvf{from{opacity:0;transform:scale(.2) rotate(-25deg)}}
@keyframes flt{50%{transform:translateY(-14px)}}
.rv-f .orb{width:min(46vmin,260px);height:min(46vmin,260px);}
.rv-f .orb b{font-size:min(20vmin,110px)}
.rv-f .orb:before{width:min(9vmin,50px);height:min(6vmin,32px);top:-4%}
.rv-f img{width:min(52vmin,320px);height:min(52vmin,320px);object-fit:contain;}
.rv-x{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px)+14px);right:16px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:2rem;line-height:1;cursor:pointer;transition:.2s}
.rv-x:hover{background:rgba(255,255,255,.28);transform:rotate(90deg) scale(1.08)}
.inf{display:block;color:var(--mute);font-style:normal;font-size:.9rem;margin-top:4px}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.rv.meme .rv-glow{animation:rvp 2.6s ease-in-out infinite,hue 3s linear infinite}
.rv.meme .rv-rays{animation:rvs 45s linear infinite,hue 3s linear infinite}
.rv.meme .rv-top h2{animation:hue 3s linear infinite}
@media (pointer:fine){html.cc,html.cc *{cursor:none!important}html.cc input,html.cc textarea{cursor:text!important}html.cc select,html.cc input[type=checkbox]{cursor:pointer!important}}
.cd,.cr{position:fixed;left:0;top:0;pointer-events:none;z-index:1000;border-radius:50%;transform:translate(-100px,-100px)}
.cd{width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff;}
.cr{width:36px;height:36px;margin:-18px 0 0 -18px;border:2px solid var(--cy);transition:width .2s,height .2s,margin .2s,border-color .2s,background .2s,opacity .2s}
.cr.hot{width:54px;height:54px;margin:-27px 0 0 -27px;border-color:var(--mg);background:rgba(255,61,154,.12)}
.cr.dn{width:22px;height:22px;margin:-11px 0 0 -11px}
.nat .cd,.nat .cr{opacity:0}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
@media (max-width:700px){#fx{display:none}.panel:before{animation:none}.rv-rays{display:none}}
