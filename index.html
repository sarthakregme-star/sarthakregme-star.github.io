<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roll, Flip, Choose</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--ink:#eef2ff;--mute:#8d99c2;--cy:#22e4ff;--mg:#ff3d9a;--go:#ffc83d;--vi:#8b5cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(1200px 700px at 15% -10%,#1a1f5a 0%,transparent 60%),radial-gradient(900px 600px at 100% 10%,#3a0f4d 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:34px 18px 60px}
h1{font-size:clamp(2.3rem,8vw,3.8rem);font-weight:800;letter-spacing:-.04em;margin:0 0 6px;line-height:1;background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg),var(--cy));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.sub{color:var(--mute);margin:0 0 26px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:16px;padding:5px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 1rem inherit;font-family:inherit;padding:11px;border-radius:12px;cursor:pointer;transition:.25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:#06101f;background:linear-gradient(135deg,var(--cy),var(--vi));box-shadow:0 0 22px rgba(34,228,255,.45)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.panel{position:relative;background:rgba(14,20,48,.62);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.panel:before{content:"";position:absolute;inset:-1px;border-radius:23px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--cy),var(--mg),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.panel[hidden]{display:none}
.panel:not([hidden]){animation:in .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:5px;font-size:.9rem;color:var(--mute);font-weight:600}
input,select,textarea{font:inherit;font-family:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;min-width:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 14px rgba(34,228,255,.35)}
select option{color:#111}
input[type=number]{width:110px}
textarea{width:100%;min-height:130px;resize:vertical}
.go{position:relative;overflow:hidden;font:800 1.05rem inherit;font-family:inherit;color:#1b0a14;background:linear-gradient(135deg,var(--go),var(--mg));border:0;border-radius:14px;padding:13px 30px;cursor:pointer;box-shadow:0 0 24px rgba(255,61,154,.45);transition:transform .15s,box-shadow .2s}
.go:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 36px rgba(255,61,154,.7)}
.go:active{transform:scale(.96)}
.go:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:sweep 2.8s infinite}
@keyframes sweep{60%,100%{left:130%}}
.out{margin-top:22px;min-height:40px}
.stats{display:flex;flex-wrap:wrap;gap:10px 30px;margin:6px 0 18px;color:var(--mute)}
.stats b{display:block;font-size:clamp(1.6rem,6vw,2.3rem);font-weight:800;line-height:1.1;color:var(--ink);text-shadow:0 0 18px rgba(34,228,255,.6)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;max-height:290px;overflow:auto;padding:6px 2px;perspective:600px}
.tile{min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(139,92,255,.35),rgba(34,228,255,.18));border:1px solid rgba(255,255,255,.18);border-radius:12px;font-weight:800;animation:tumble .7s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:var(--d,0s)}
.tile.max{border-color:var(--go);box-shadow:0 0 14px rgba(255,200,61,.7)}
.tile.h{background:linear-gradient(145deg,var(--cy),var(--vi));color:#06101f}
.tile.t{background:linear-gradient(145deg,var(--go),var(--mg));color:#1b0a14}
@keyframes tumble{0%{opacity:0;transform:translateY(-70px) rotateX(-320deg) rotateZ(-200deg) scale(.2)}70%{opacity:1}100%{transform:none}}
.tally{display:grid;gap:6px;margin-top:16px}
.bar{display:grid;grid-template-columns:40px 1fr 74px;gap:10px;align-items:center;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--cy),var(--mg));box-shadow:0 0 10px rgba(34,228,255,.5);transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.bar span:last-child{text-align:right;color:var(--mute)}
.stage{height:190px;display:grid;place-items:center;perspective:700px}
.coin{position:relative;width:120px;height:120px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.3rem;backface-visibility:hidden;border:6px solid rgba(255,255,255,.35);box-shadow:inset 0 0 22px rgba(0,0,0,.25),0 0 30px rgba(255,200,61,.5)}
.face.f{background:radial-gradient(circle at 30% 30%,#fff3b8,var(--go) 55%,#c98a00);color:#4a3000}
.face.b{background:radial-gradient(circle at 30% 30%,#ffd1ea,var(--mg) 55%,#a3145f);color:#fff;transform:rotateY(180deg)}
.shadow{width:90px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(6px);margin-top:-6px}
.reel{height:84px;border-radius:16px;display:grid;place-items:center;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);overflow:hidden;padding:0 14px;text-align:center;word-break:break-word}
.reel.spin{color:var(--mute);filter:blur(1px)}
.reel.done{color:#06101f;background:linear-gradient(135deg,var(--cy),var(--go));box-shadow:0 0 40px rgba(34,228,255,.7);animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{from{transform:scale(.7)}}
.picks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pick{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 16px;font-weight:700;font-size:1.1rem;animation:slide .5s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d,0s)}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}}
.note{color:var(--mute);font-size:.9rem;margin-top:10px}
.err{color:#ff7a93;font-weight:600;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
<h1>Roll, flip, choose.</h1>
<p class="sub">Fair random results, as many times as you like.</p>

<div class="tabs" role="tablist">
<button role="tab" id="t-dice" aria-selected="true">🎲 Dice</button>
<button role="tab" id="t-coin" aria-selected="false">🪙 Coin</button>
<button role="tab" id="t-pick" aria-selected="false">🎯 Chooser</button>
</div>

<section class="panel" id="p-dice" role="tabpanel">
<div class="row">
<label>Number of rolls<input id="d-n" type="number" min="1" max="10000" value="5"></label>
<label>Dice type<select id="d-s"><option value="4">d4</option><option value="6" selected>d6</option><option value="8">d8</option><option value="10">d10</option><option value="12">d12</option><option value="20">d20</option><option value="100">d100</option></select></label>
<button class="go" id="d-go">Roll</button>
</div>
<div class="out" id="d-out" aria-live="polite"></div>
</section>

<section class="panel" id="p-coin" role="tabpanel" hidden>
<div class="row">
<label>Number of flips<input id="c-n" type="number" min="1" max="10000" value="1"></label>
<button class="go" id="c-go">Flip</button>
</div>
<div class="stage"><div><div class="coin" id="coin"><div class="face f">HEADS</div><div class="face b">TAILS</div></div><div class="shadow" id="sh"></div></div></div>
<div class="out" id="c-out" aria-live="polite"></div>
</section>

<section class="panel" id="p-pick" role="tabpanel" hidden>
<label>Options, one per line
<textarea id="r-list" placeholder="Pizza&#10;Tacos&#10;Sushi"></textarea></label>
<div class="row" style="margin-top:14px">
<label>How many to pick<input id="r-n" type="number" min="1" max="1000" value="1"></label>
<label style="flex-direction:row;align-items:center;gap:8px;padding-bottom:10px"><input id="r-rep" type="checkbox" style="width:auto"> Allow repeats</label>
<button class="go" id="r-go">Choose</button>
</div>
<div class="out" id="r-out" aria-live="polite"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function count(el,max){const v=Math.floor(Number(el.value));return(v>=1&&v<=max)?v:null}
const LIMIT=300,esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- particle field + bursts ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let W,H,ps=[],bs=[],mouse={x:-999,y:-999};
const COL=['#22e4ff','#ff3d9a','#ffc83d','#8b5cff','#ffffff'];
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  const n=Math.min(90,Math.floor(W*H/14000));ps=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.8+.6,c:COL[Math.random()*4|0]}))}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function burst(x,y,n=60){if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*9+2;
  bs.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*3.5+1.5,c:COL[Math.random()*5|0],l:1,sq:Math.random()<.4})}}
function burstAt(el,n){const b=el.getBoundingClientRect();burst(b.left+b.width/2,b.top+Math.min(b.height/2,120),n)}
(function loop(){
  cx.clearRect(0,0,W,H);
  for(const p of ps){
    const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
    if(d<130){p.vx+=dx/d*.05;p.vy+=dy/d*.05}
    p.vx*=.995;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    cx.globalAlpha=.8;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
  }
  if(!RM){cx.lineWidth=.6;
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<110){cx.globalAlpha=(1-d/110)*.28;cx.strokeStyle='#8b9cff';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}}
  for(let i=bs.length-1;i>=0;i--){const p=bs[i];p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.l-=.014;
    if(p.l<=0){bs.splice(i,1);continue}
    cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;
    p.sq?cx.fillRect(p.x,p.y,p.r*1.8,p.r*1.8):(cx.beginPath(),cx.arc(p.x,p.y,p.r,0,6.283),cx.fill());cx.shadowBlur=0}
  requestAnimationFrame(loop);
})();

/* ---------- helpers ---------- */
function countUp(el,to,dec=0,ms=900){if(RM){el.textContent=to.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});return}
  const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);
    el.textContent=(to*e).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});if(k<1)requestAnimationFrame(f)})(t0)}
function bars(map,keys,total){const top=Math.max(...keys.map(k=>map[k]||0),1);
  return'<div class="tally">'+keys.map((k,i)=>{const c=map[k]||0;
    return`<div class="bar"><span>${k}</span><i style="width:${(c/top*100).toFixed(1)}%;animation-delay:${i*40}ms"></i><span>${c} (${(c/total*100).toFixed(0)}%)</span></div>`}).join('')+'</div>'}
const stagger=i=>Math.min(i*14,1100)/1000;

/* ---------- tabs ---------- */
const names=['dice','coin','pick'];
names.forEach(n=>$('t-'+n).onclick=()=>{names.forEach(m=>{$('t-'+m).setAttribute('aria-selected',m===n);$('p-'+m).hidden=m!==n});burstAt($('t-'+n),14)});

/* ---------- dice ---------- */
$('d-go').onclick=async e=>{
  const out=$('d-out'),n=count($('d-n'),10000),s=+$('d-s').value;
  if(!n){out.innerHTML='<p class="err">Enter a whole number from 1 to 10,000.</p>';return}
  const r=[],map={};let sum=0;
  for(let i=0;i<n;i++){const v=rnd(s)+1;r.push(v);sum+=v;map[v]=(map[v]||0)+1}
  const lo=Math.min(...r),hi=Math.max(...r);
  let h=`<div class="stats"><div><b id="k-sum">0</b>total</div><div><b id="k-avg">0</b>average</div><div><b>${lo} – ${hi}</b>lowest – highest</div></div>`;
  h+='<div class="tiles">'+r.slice(0,LIMIT).map((v,i)=>`<div class="tile${v===s&&s>2?' max':''}" style="--d:${stagger(i)}s">${v}</div>`).join('')+'</div>';
  if(n>LIMIT)h+=`<p class="note">Showing the first ${LIMIT} of ${n.toLocaleString()} rolls. Totals and counts include all of them.</p>`;
  if(s<=20)h+=bars(map,Array.from({length:s},(_,i)=>i+1),n);
  out.innerHTML=h;countUp($('k-sum'),sum);countUp($('k-avg'),sum/n,2);
  burstAt(e.currentTarget,r.includes(s)?70:30);
};

/* ---------- coin ---------- */
let spinAngle=0;
$('c-go').onclick=async e=>{
  const out=$('c-out'),n=count($('c-n'),10000),coin=$('coin'),btn=e.currentTarget;
  if(!n){out.innerHTML='<p class="err">Enter a whole number from 1 to 10,000.</p>';return}
  const r=[];let heads=0;for(let i=0;i<n;i++){const hd=rnd(2)===0;r.push(hd);if(hd)heads++}
  const last=r[n-1],tails=n-heads;out.innerHTML='';btn.disabled=true;
  const from=spinAngle,to=Math.ceil(from/360)*360+1800+(last?0:180);spinAngle=to;
  if(RM){coin.style.transform=`rotateY(${to}deg)`}
  else{
    coin.animate([{transform:`translateY(0) rotateY(${from}deg)`},{transform:`translateY(-90px) rotateY(${(from+to)/2}deg)`,offset:.5},{transform:`translateY(0) rotateY(${to}deg)`}],{duration:1300,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'});
    $('sh').animate([{transform:'scale(1)',opacity:.8},{transform:'scale(.5)',opacity:.3,offset:.5},{transform:'scale(1)',opacity:.8}],{duration:1300});
    await sleep(1300);
  }
  coin.style.transform=`rotateY(${to}deg)`;btn.disabled=false;
  burstAt(coin,last?50:50);
  if(n>1){
    let h=`<div class="stats"><div><b id="k-h">0</b>heads (${(heads/n*100).toFixed(1)}%)</div><div><b id="k-t">0</b>tails (${(tails/n*100).toFixed(1)}%)</div></div>`;
    h+='<div class="tiles">'+r.slice(0,LIMIT).map((x,i)=>`<div class="tile ${x?'h':'t'}" style="--d:${stagger(i)}s">${x?'H':'T'}</div>`).join('')+'</div>';
    if(n>LIMIT)h+=`<p class="note">Showing the first ${LIMIT} of ${n.toLocaleString()} flips. Counts include all of them.</p>`;
    out.innerHTML=h;countUp($('k-h'),heads);countUp($('k-t'),tails);
  }else out.innerHTML=`<div class="stats"><div><b>${last?'Heads':'Tails'}</b>result</div></div>`;
};

/* ---------- chooser ---------- */
$('r-go').onclick=async e=>{
  const out=$('r-out'),btn=e.currentTarget,list=$('r-list').value.split('\n').map(x=>x.trim()).filter(Boolean),n=count($('r-n'),1000),rep=$('r-rep').checked;
  if(!list.length){out.innerHTML='<p class="err">Add at least one option, one per line.</p>';return}
  if(!n){out.innerHTML='<p class="err">Enter how many to pick, from 1 to 1,000.</p>';return}
  if(!rep&&n>list.length){out.innerHTML=`<p class="err">You have ${list.length} option${list.length>1?'s':''}. Pick fewer, or turn on Allow repeats.</p>`;return}
  const picks=[];
  if(rep){for(let i=0;i<n;i++)picks.push(list[rnd(list.length)])}
  else{const pool=list.slice();for(let i=0;i<n;i++)picks.push(pool.splice(rnd(pool.length),1)[0])}
  btn.disabled=true;out.innerHTML='<div class="reel spin" id="reel">…</div>';const reel=$('reel');
  if(!RM){for(let i=0,d=40;d<260;i++,d*=1.13){reel.textContent=list[rnd(list.length)];await sleep(d)}}
  reel.className='reel done';reel.textContent=picks[0];
  burstAt(reel,80);btn.disabled=false;
  if(n>1)out.insertAdjacentHTML('beforeend','<div class="picks">'+picks.slice(1,LIMIT).map((p,i)=>`<div class="pick" style="--d:${stagger(i)}s">${esc(p)}</div>`).join('')+'</div>'+(n>LIMIT?`<p class="note">Showing the first ${LIMIT} of ${n} picks.</p>`:''));
  reel.textContent=picks[0];
};
</script>
</body>
</html>
